name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Format check (ruff)
        run: python -m ruff format --check src tests

      - name: Type check (mypy strict)
        run: python -m mypy src

      - name: Tests + branch coverage (>= 85%)
        run: python -m pytest --cov=pytest_collection_guard --cov-branch --cov-fail-under=85

  check-script:
    name: scripts/check.sh (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run the quality gate
        run: bash scripts/check.sh

  packaging:
    name: package & clean install (wheel + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Clean install in fresh virtual environment
        run: |
          python -m venv /tmp/clean-env
          /tmp/clean-env/bin/pip install dist/*.whl

      - name: Run CLI demo and compare in clean environment
        run: |
          /tmp/clean-env/bin/pytest-collection-guard --version
          /tmp/clean-env/bin/pytest-collection-guard --help
          /tmp/clean-env/bin/pytest-collection-guard demo --dir /tmp/demo-clean
          /tmp/clean-env/bin/pytest-collection-guard compare /tmp/demo-clean/baseline.json /tmp/demo-clean/baseline.json

      - name: Verify the pytest11 entry point loaded from the wheel
        run: |
          mkdir -p /tmp/entrypoint/tests
          printf 'def test_ok():\n    assert True\n' > /tmp/entrypoint/tests/test_ok.py
          cd /tmp/entrypoint
          /tmp/clean-env/bin/pytest --collect-only -q \
            --collection-guard-out manifest.json --collection-guard-profile linux tests
          /tmp/clean-env/bin/python -c \
            "import json; d = json.load(open('manifest.json')); assert d['status'] == 'ok', d; assert d['identity']['selected'] == ['tests/test_ok.py::test_ok'], d"
          /tmp/clean-env/bin/pytest-collection-guard compare manifest.json manifest.json