name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Format check (ruff)
        run: python -m ruff format --check src tests

      - name: Type check (mypy strict)
        run: python -m mypy src

      - name: Tests + branch coverage (>= 85%)
        run: python -m pytest --cov=pytest_collection_guard --cov-branch --cov-fail-under=85

  check-script:
    name: scripts/check.sh (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run the quality gate
        run: bash scripts/check.sh

  packaging:
    name: package & clean install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # venv layout differs per platform; keep every path in one place.
      VENV_BIN: ${{ matrix.os == 'windows-latest' && '.clean-env/Scripts' || '.clean-env/bin' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        shell: bash
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Clean install in fresh virtual environment
        shell: bash
        run: |
          python -m venv .clean-env
          "$VENV_BIN/pip" install dist/*.whl

      - name: Run CLI demo and compare in clean environment
        shell: bash
        run: |
          "$VENV_BIN/pytest-collection-guard" --version
          "$VENV_BIN/pytest-collection-guard" --help
          "$VENV_BIN/pytest-collection-guard" demo --dir demo-clean
          "$VENV_BIN/pytest-collection-guard" compare demo-clean/baseline.json demo-clean/baseline.json

      - name: Verify the pytest11 entry point loaded from the wheel
        shell: bash
        run: |
          VENV_DIR="$PWD/$VENV_BIN"
          if command -v cygpath >/dev/null 2>&1; then
            VENV_DIR="$(cygpath -m "$VENV_DIR")"
          fi
          # Outside the checkout: the repo's own pyproject.toml disables this
          # plugin (-p no:collection_guard) and would mask a broken entry point.
          WORK="$(mktemp -d)"
          cd "$WORK"
          mkdir -p tests
          printf 'def test_ok():\n    assert True\n' > tests/test_ok.py
          "$VENV_DIR/pytest" --collect-only -q \
            --collection-guard-out manifest.json --collection-guard-profile linux tests
          "$VENV_DIR/python" -c \
            "import json; d = json.load(open('manifest.json')); assert d['status'] == 'ok', d; assert d['identity']['selected'] == ['tests/test_ok.py::test_ok'], d"
          "$VENV_DIR/pytest-collection-guard" compare manifest.json manifest.json
