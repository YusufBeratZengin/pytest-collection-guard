name: Feature request
description: Propose an improvement to pytest-collection-guard
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Scope note: v0.1 is a **collection** guard. Coverage measurement,
        generating missing tests, reducing test runs and auto-accepting
        baselines are explicitly out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete collection surprise or workflow pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: CLI/API shape, example output, exit-code expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This does not change which tests run (the guard stays observational)
          required: true